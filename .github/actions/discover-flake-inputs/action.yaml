name: 'Discover flake inputs'
description: 'List root flake inputs and build a matrix for parallel updates'

inputs:
  inputs:
    description: 'Space-separated inputs to update (empty for all)'
    required: false
    default: ''
  exclude-inputs:
    description: 'Space-separated inputs to exclude'
    required: false
    default: ''
  skip-delay-inputs:
    description: 'Space-separated inputs that skip the release age check'
    required: false
    default: ''

outputs:
  matrix:
    description: 'JSON matrix for the update job'
    value: ${{ steps.discover.outputs.matrix }}
  has-updates:
    description: 'Whether any input is a candidate'
    value: ${{ steps.discover.outputs.has-updates }}

runs:
  using: 'composite'
  steps:
    - name: Discover flake inputs
      id: discover
      shell: bash
      env:
        INPUTS: ${{ inputs.inputs }}
        EXCLUDE_INPUTS: ${{ inputs.exclude-inputs }}
        SKIP_DELAY_INPUTS: ${{ inputs.skip-delay-inputs }}
      run: |
        set -euo pipefail

        in_list() {
          local needle="$1" list="$2" item
          for item in $list; do
            [ "$item" = "$needle" ] && return 0
          done
          return 1
        }

        if [ ! -f flake.lock ]; then
          echo "No flake.lock found"
          {
            echo 'matrix={"include":[]}'
            echo 'has-updates=false'
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        meta=$(nix flake metadata --json --no-write-lock-file)

        if [ -z "${INPUTS// /}" ]; then
          names=$(jq -r '.locks.nodes.root.inputs | keys[]' <<<"$meta" | sort)
        else
          names=$(for w in $INPUTS; do echo "$w"; done)
        fi

        entries='[]'
        while IFS= read -r name; do
          [ -n "$name" ] || continue
          if in_list "$name" "$EXCLUDE_INPUTS"; then
            echo "  - $name (excluded)"
            continue
          fi
          if ! jq -e --arg n "$name" '.locks.nodes[$n] != null' <<<"$meta" >/dev/null; then
            echo "  - $name (not in flake.lock, skipped)"
            continue
          fi
          if in_list "$name" "$SKIP_DELAY_INPUTS"; then skip=true; else skip=false; fi
          entry=$(jq -c --arg n "$name" --argjson skip "$skip" '
            .locks.nodes[$n] as $node
            | {
                name: $n,
                current_version: (($node.locked.rev? // "unknown")[0:8]),
                skip_delay: $skip,
                owner: ($node.original.owner? // "unknown"),
                repo: ($node.original.repo? // "unknown"),
                ref: ($node.original.ref? // "")
              }' <<<"$meta")
          entries=$(jq -c --argjson e "$entry" '. + [$e]' <<<"$entries")
          echo "  - $name $entry"
        done <<< "$names"

        if [ "$(jq 'length' <<<"$entries")" -gt 0 ]; then
          matrix=$(jq -c '{include: .}' <<<"$entries")
          has=true
        else
          matrix='{"include":[]}'
          has=false
        fi
        echo "$(jq 'length' <<<"$entries") input(s) to check"

        {
          echo "matrix=$matrix"
          echo "has-updates=$has"
        } >> "$GITHUB_OUTPUT"
