name: 'Setup Nix'
description: 'Install Nix with flakes enabled'

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          experimental-features = nix-command flakes
