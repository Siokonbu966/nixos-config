name: Update flake inputs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      inputs:
        description: 'Space-separated flake inputs to update (empty for all)'
        required: false
        default: ''
      exclude-inputs:
        description: 'Space-separated flake inputs to exclude'
        required: false
        default: ''
      skip-delay:
        description: 'Skip the minimum release age check for all inputs'
        required: false
        type: boolean
        default: false
      minimum-release-age-days:
        description: 'Minimum release age in days'
        required: false
        type: number
        default: 3
      auto-merge:
        description: 'Enable auto-merge for the pull requests'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-updates: ${{ steps.discover.outputs.has-updates }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-nix

      - name: Discover flake inputs
        id: discover
        uses: ./.github/actions/discover-flake-inputs
        with:
          inputs: ${{ github.event.inputs.inputs || '' }}
          exclude-inputs: ${{ github.event.inputs.exclude-inputs || '' }}

  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository (for local actions)
        uses: actions/checkout@v5

      - name: Set up git bot identity
        id: bot
        uses: ./.github/actions/setup-git-bot
        with:
          app-id: ${{ secrets.NIX_UPDATER_APP_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout repository (with bot token)
        uses: actions/checkout@v5
        with:
          token: ${{ steps.bot.outputs.token }}

      - uses: ./.github/actions/setup-nix

      - name: Update flake input
        uses: ./.github/actions/update-flake-input
        with:
          input-name: ${{ matrix.name }}
          current-version: ${{ matrix.current_version }}
          owner: ${{ matrix.owner }}
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          skip-delay: ${{ github.event.inputs.skip-delay == 'true' || matrix.skip_delay }}
          minimum-release-age-days: ${{ github.event.inputs.minimum-release-age-days || 3 }}
          auto-merge: ${{ github.event.inputs.auto-merge != 'false' }}
          github-token: ${{ steps.bot.outputs.token }}
